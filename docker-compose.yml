services:
  # =========================
  # Main API Application
  # =========================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-sharing-vision-test
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development 
      - DATABASE_URL=root:password@tcp(db:3306)/article?charset=utf8mb4&parseTime=True&loc=Local
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=article
      - REDIS_URL=redis:6379 
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-sharing-vision-test-network

  # =========================
  # MySQL Database (article)
  # =========================
  db:
    image: mysql:8.0
    container_name: backend-sharing-vision-test-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=article
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/manual_create_posts.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - backend-sharing-vision-test-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Redis Cache (Optional)
  # =========================
  redis:
    image: redis:7-alpine
    container_name: backend-sharing-vision-test-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-sharing-vision-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend-sharing-vision-test-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data: